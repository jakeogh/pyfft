[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfft"
version = "1!0.0.1785928806"
description = "Spectra, peaks, and ADC metrics for high-speed ADC records"
authors = [
    { name = "Justin Keogh", email = "github.com@v6y.net" },
]
dependencies = [
    "numpy",
    "scipy",
]
license = "ISC"
requires-python = ">=3.11"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
exclude = [
    "tests",
]

[tool.setuptools.package-data]
pyfft = [
    "py.typed",
]
